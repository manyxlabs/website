<!doctype html>
<!-- The source of public/og.png, the 1200x630 share image. See the README to render it. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Geist Variable';
        font-weight: 100 900;
        src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2');
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
        /* The site's dark backdrop: a faint white halo over the dot grid (see Base.astro). */
        background:
          radial-gradient(closest-side at 50% 0%, rgb(255 255 255 / 0.07), transparent),
          #050506;
        color: #f5f5f7;
        font-family: 'Geist Variable', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(rgb(255 255 255 / 0.09) 1px, transparent 1px) 0 0 / 22px 22px;
        mask-image: radial-gradient(ellipse 90% 80% at 50% 30%, black, transparent);
        z-index: -1;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.025em;
      }

      .url {
        color: #34d399;
        font-size: 24px;
        font-weight: 500;
      }

      h1 {
        margin-top: 56px;
        max-width: 16ch;
        font-size: 76px;
        font-weight: 600;
        line-height: 1.04;
        letter-spacing: -0.025em;
      }

      .lede {
        margin-top: 20px;
        color: #a1a1a6;
        font-size: 26px;
      }

      ul {
        display: grid;
        grid-template-columns: repeat(3, auto);
        gap: 16px;
        margin-top: auto;
        padding: 0;
        list-style: none;
      }

      li {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px;
        border: 1px solid rgb(255 255 255 / 0.1);
        border-radius: 24px;
        background: linear-gradient(180deg, rgb(44 44 48 / 0.55), rgb(24 24 26 / 0.4));
        box-shadow: 0 8px 32px -8px rgb(0 0 0 / 0.5);
      }

      .glyph {
        display: grid;
        flex: none;
        place-items: center;
        width: 52px;
        height: 52px;
        border: 1px solid rgb(245 245 247 / 0.1);
        border-radius: 16px;
        background: rgb(245 245 247 / 0.05);
      }

      .glyph svg {
        fill: none;
        stroke: #f5f5f7;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      b {
        display: block;
        font-size: 21px;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.25;
        white-space: nowrap;
      }

      small {
        color: #a1a1a6;
        font-size: 17px;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">
        <svg width="52" height="52" viewBox="0 0 48 48">
          <mask id="mx" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
            <rect width="48" height="48" fill="#fff" />
            <circle cx="24" cy="24" r="9" fill="#000" />
          </mask>
          <g mask="url(#mx)" fill="none" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round">
            <path d="M9 9 C 22 20, 26 28, 39 39" />
            <path d="M39 9 C 26 20, 22 28, 9 39" />
          </g>
          <circle cx="24" cy="24" r="5" fill="#34d399" />
        </svg>
        Manyx Labs
      </span>
      <span class="url">manyxlabs.com</span>
    </header>
    <h1>Software that does the work for you.</h1>
    <p class="lede">Applied AI tools, SaaS and free everyday utilities, from Bengaluru.</p>
    <ul>
      <li>
        <span class="glyph">
          <svg viewBox="0 0 24 24" width="26" height="26">
            <path d="M4 4h8v16H4zM7 8h2M7 12h2M15 6h5v5h-5zM15 14h5v5h-5zM12 8.5h3M12 16.5h3" />
          </svg>
        </span>
        <span><b>Gloss Reader</b><small>Reading &amp; research</small></span>
      </li>
      <li>
        <span class="glyph">
          <svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 4v16h16M8 15l3.5-4 3 3L20 7" /></svg>
        </span>
        <span><b>Mutual Fund Screener</b><small>Finance research</small></span>
      </li>
      <li>
        <span class="glyph">
          <svg viewBox="0 0 24 24" width="26" height="26">
            <path d="M4 5h16v14H4zM4 15l4.5-4.5 4 4 2.5-2.5 5 5M15.5 9.5h.01" />
          </svg>
        </span>
        <span><b>Form &amp; Paperwork Tools</b><small>Everyday utility</small></span>
      </li>
    </ul>
  </body>
</html>
