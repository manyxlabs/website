<!doctype html>
<!-- The source of public/og.png, the 1200x630 share image. See the README to render it. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Inter Variable';
        font-weight: 100 900;
        src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(560px 420px at 8% 0%, rgb(16 185 129 / 0.34), transparent 70%),
          radial-gradient(560px 420px at 100% 6%, rgb(59 130 246 / 0.3), transparent 70%),
          radial-gradient(640px 380px at 62% 100%, rgb(139 92 246 / 0.32), transparent 70%),
          #050506;
        color: #f5f5f7;
        font-family: 'Inter Variable', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* The hero's dotted grid, fading out from the headline. */
      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(rgb(161 161 166 / 0.3) 1px, transparent 1.5px) 0 0 / 24px 24px;
        mask-image: radial-gradient(ellipse 60% 70% at 70% 35%, #000 20%, transparent 75%);
        z-index: -1;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 34px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .url {
        color: #34d399;
        font-size: 24px;
        font-weight: 550;
      }

      h1 {
        margin-top: 56px;
        max-width: 16ch;
        font-size: 76px;
        font-weight: 700;
        line-height: 1.04;
        letter-spacing: -0.035em;
      }

      .lede {
        margin-top: 20px;
        color: #a1a1a6;
        font-size: 26px;
      }

      ul {
        display: grid;
        grid-template-columns: repeat(3, auto);
        gap: 16px;
        margin-top: auto;
        padding: 0;
        list-style: none;
      }

      li {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px;
        border: 1px solid rgb(255 255 255 / 0.1);
        border-radius: 20px;
        background: rgb(28 28 32 / 0.55);
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.08);
      }

      .glyph {
        display: grid;
        flex: none;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--from), var(--to));
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.4);
      }

      .glyph svg {
        fill: none;
        stroke: #fff;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      b {
        display: block;
        font-size: 21px;
        font-weight: 620;
        letter-spacing: -0.01em;
        line-height: 1.25;
        white-space: nowrap;
      }

      small {
        color: #a1a1a6;
        font-size: 17px;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">
        <svg width="52" height="52" viewBox="0 0 48 48">
          <mask id="mx" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
            <rect width="48" height="48" fill="#fff" />
            <circle cx="24" cy="24" r="9" fill="#000" />
          </mask>
          <g mask="url(#mx)" fill="none" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round">
            <path d="M9 9 C 22 20, 26 28, 39 39" />
            <path d="M39 9 C 26 20, 22 28, 9 39" />
          </g>
          <circle cx="24" cy="24" r="5" fill="#34d399" />
        </svg>
        Manyx Labs
      </span>
      <span class="url">manyxlabs.com</span>
    </header>
    <h1>Software that does the work for you.</h1>
    <p class="lede">Applied AI tools, SaaS and free everyday utilities, from Bengaluru.</p>
    <ul>
      <li style="--from: #f59e0b; --to: #ec4899">
        <span class="glyph">
          <svg viewBox="0 0 24 24" width="26" height="26">
            <path d="M4 4h8v16H4zM7 8h2M7 12h2M15 6h5v5h-5zM15 14h5v5h-5zM12 8.5h3M12 16.5h3" />
          </svg>
        </span>
        <span><b>Gloss Reader</b><small>Reading &amp; research</small></span>
      </li>
      <li style="--from: #6366f1; --to: #a855f7">
        <span class="glyph">
          <svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 4v16h16M8 15l3.5-4 3 3L20 7" /></svg>
        </span>
        <span><b>Mutual Fund Screener</b><small>Finance research</small></span>
      </li>
      <li style="--from: #10b981; --to: #0ea5e9">
        <span class="glyph">
          <svg viewBox="0 0 24 24" width="26" height="26">
            <path d="M4 5h16v14H4zM4 15l4.5-4.5 4 4 2.5-2.5 5 5M15.5 9.5h.01" />
          </svg>
        </span>
        <span><b>Form &amp; Paperwork Tools</b><small>Everyday utility</small></span>
      </li>
    </ul>
  </body>
</html>
